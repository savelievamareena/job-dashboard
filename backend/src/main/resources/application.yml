server:
  # Loopback only: there is no authentication in front of the API, so anything reaching this
  # port can read every posting and note and change statuses.
  address: 127.0.0.1
  port: 8765

spring:
  application:
    name: job-dashboard
  jackson:
    default-property-inclusion: always
  datasource:
    # Credentials come from .env or the environment, never from this file. The url and user have
    # local defaults because they are not secrets; the password deliberately has none.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobdashboard}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      # Do not probe the database while starting. Both pages need it now, so a stopped container
      # empties the whole dashboard either way - but it has to empty it onto a page that says
      # which container to start, and an application that refuses to boot cannot say anything.
      initialization-fail-timeout: -1
      # The default is 30s, which is how long a page would sit on a spinner before admitting the
      # container is down. The database is on localhost: if it is there at all, it answers in
      # well under this.
      connection-timeout: 4000

dashboard:
  cv:
    # Which CV cores exist. A core answers the track of the same name, so Frontend is what a
    # frontend posting is told about. Kept here rather than read back out of cv_queue: a core
    # with nothing built yet still owns its track and has no rows to be found by.
    cores:
      - Frontend
      - Fullstack

logging:
  level:
    com.savelieva.jobdashboard: INFO
